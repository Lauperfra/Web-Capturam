; Límite de subida de archivos para el panel de publicaciones (PDF/imagen).
; Solo tiene efecto en hostings que usen PHP-FPM/CGI (la mayoría de hostings
; compartidos modernos); NO tiene efecto con el servidor de desarrollo de PHP
; (`php -S`) ni con mod_php clásico — en esos casos hay que subir el límite
; de otra forma (ver server/config.example.php / documentación del hosting).
upload_max_filesize = 20M
post_max_size = 20M
