<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Capturam Ingeniería{% endblock %}</title>
  <meta name="description" content="{% block description %}Ingeniería y desarrollo de proyectos solares, eólicos, BESS e hibridados: suelo, acceso a red, viabilidad, permisos, RtB y PES.{% endblock %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

  <nav class="navbar navbar-expand-md">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('inicio') }}">
        <img src="{{ url_for('static', filename='img/logo-capturam.png') }}" alt="Capturam Ingeniería">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('empresa') }}">Empresa</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('servicios') }}">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('sectores') }}">Sectores</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('proyectos') }}">Proyectos</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('como_trabajamos') }}">Cómo trabajamos</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('conocimiento') }}">Conocimiento</a></li>
          <li class="nav-item"><a class="btn btn-capturam ms-md-2" href="{{ url_for('contacto') }}">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>&copy; 2026 Capturam Ingeniería S.L. Todos los derechos reservados.</span>
      <span><a href="{{ url_for('legal') }}">Aviso legal · Privacidad · Cookies</a></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
