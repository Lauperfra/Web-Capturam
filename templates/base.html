<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Capturam Ingeniería{% endblock %}</title>
  <meta name="description" content="{% block description %}Ingeniería y desarrollo de proyectos solares, eólicos, BESS e hibridados: suelo, acceso a red, viabilidad, permisos, RtB y PES.{% endblock %}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='img/favicon-48.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

  <nav class="navbar navbar-expand-md sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('inicio') }}">
        <img src="{{ url_for('static', filename='img/logo-capturam-claro.png') }}" alt="Capturam Ingeniería">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('servicios') }}">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('sectores') }}">Sectores</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('proyectos') }}">Proyectos</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('empresa') }}">Quiénes somos</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('como_trabajamos') }}">Cómo trabajamos</a></li>
          <li class="nav-item"><a class="btn btn-capturam ms-md-2" href="{{ url_for('contacto') }}">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>&copy; Capturam Ingeniería S.L. Todos los derechos reservados.</span>
      <span>
        <a href="{{ url_for('legal') }}">Aviso legal</a>
        ·
        <a href="{{ url_for('privacidad') }}">Política de privacidad</a>
      </span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
