{% extends "base.html" %}
{% block title %}Capturam Ingeniería · Contacto{% endblock %}

{% block contenido %}
<section class="container">
  <div class="col-formulario">
  <h1 class="section-title">Contacta con nosotros</h1>

  <div id="form-mensaje" class="form-mensaje" hidden></div>

  <!-- Envío gestionado por Formspree (sin backend propio): sustituir TU_ID_AQUI
       por el ID real del formulario en cuanto exista (ver aviso al final de este archivo). -->
  <form id="form-contacto" method="POST" action="https://formspree.io/f/TU_ID_AQUI">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" name="nombre" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Mensaje</label>
      <textarea name="mensaje" rows="5" class="form-control" required></textarea>
    </div>
    <input type="hidden" name="_subject" value="Nuevo mensaje de contacto — web Capturam">
    <input type="text" name="_gotcha" class="campo-oculto" tabindex="-1" autocomplete="off">
    <button type="submit" class="btn btn-capturam">Enviar mensaje</button>
  </form>

  <div class="contacto-directo">
    <h2>Contacto directo</h2>
    <div class="contacto-chips">
      <a href="mailto:ingenieria@capturam.es" class="contacto-chip">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="m4 6 8 7 8-7"></path></svg>
        ingenieria@capturam.es
      </a>
      <span class="contacto-chip contacto-chip--pendiente">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"></path></svg>
        Teléfono: [PENDIENTE]
      </span>
      <a href="https://www.linkedin.com/in/francisco-martin-lopez-acu%C3%B1a-234b00329/" target="_blank" rel="noopener" class="contacto-chip">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h17a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2ZM8 19H5v-9h3ZM6.5 8.25A1.75 1.75 0 1 1 8.3 6.5a1.78 1.78 0 0 1-1.8 1.75ZM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.63 1.63 0 0 0 13 14.19a.66.66 0 0 0 0 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 0 1 2.7-1.4c1.55 0 3.36.86 3.36 3.66Z"></path></svg>
        LinkedIn
      </a>
    </div>
  </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/contacto.js') }}"></script>
{% endblock %}
